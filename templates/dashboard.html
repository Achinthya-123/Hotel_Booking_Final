<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>
    <h1>Hotel Booking Dashboard</h1>
    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Room</th>
            <th>Total Stay (Days+Nights)</th>
            <th>Total Price (₹)</th>
            <th>Actions</th>
        </tr>
        {% for booking in bookings %}
        <tr>
            <td>{{ booking[0] }}</td>
            <td>{{ booking[1] }}</td>
            <td>{{ booking[2] }}</td>
            <td>{{ booking[3] }}</td>
            <td>{{ booking[4] }}</td>
            <td>₹{{ booking[5] }}</td>
            <td>
                <form action="/delete/{{ booking[0] }}" method="POST" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
                <form action="/extend/{{ booking[0] }}" method="POST" style="display:inline;">
                    <button type="submit">+1 Day</button>
                </form>
                <form action="/reduce/{{ booking[0] }}" method="POST" style="display:inline;">
                    <button type="submit">-1 Day</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
